name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --name bandobot main.py

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release\data\users -Force | Out-Null
          New-Item -ItemType Directory -Path release\data\history -Force | Out-Null
          Copy-Item dist\bandobot.exe release\
          Copy-Item .env.example release\.env.example
          New-Item -ItemType File -Path release\data\users\.gitkeep -Force | Out-Null
          New-Item -ItemType File -Path release\data\history\.gitkeep -Force | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: bandobot-windows
          path: release/

      - name: Zip release folder
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -Path release\* -DestinationPath bandobot-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bandobot-windows.zip

